name: Deploy to AWS

on:
  push:
    branches: [ "main" ]  # main 브랜치에 코드가 올라오면 발동!
    paths-ignore:           
      - 'README.md'         # README.md 파일이 바뀌면 무시
      - 'docs/**'           # docs 폴더 안의 파일들도 무시
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 코드 가져오기
      uses: actions/checkout@v3

    - name: 2. 도커 허브 로그인
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 3. 도커 이미지 빌드 & 푸시 (v1 덮어쓰기)
      uses: docker/build-push-action@v4
      with:
        context: ./my-portfolio
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-portfolio:v1

    - name: 4. AWS 인증
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: 5. 서버 물갈이 (Instance Refresh)
      run: |
        # Auto Scaling Group에게 "새 서버로 교체해!" 명령 내리기
        aws autoscaling start-instance-refresh \
          --auto-scaling-group-name project3-asg \
          --preferences '{"InstanceWarmup": 60, "MinHealthyPercentage": 50}'
